spring:
  application:
    name: community-cleanup-backend
  # Local convenience: values in backend/.env (KEY=value) are loaded if the file exists.
  # Real environment variables always take precedence.
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_cleanup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  public-base-url: ${APP_BASE_URL:http://localhost:${server.port}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  mail:
    from: ${MAIL_FROM:no-reply@communitycleanup.local}
    enabled: ${MAIL_ENABLED:true}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:community-cleanup}
  storage:
    local-dir: ${LOCAL_UPLOAD_DIR:uploads}
    allow-local-fallback: ${ALLOW_LOCAL_UPLOAD_FALLBACK:true}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@communitycleanup.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    demo-data: ${SEED_DEMO_DATA:true}
  rewards:
    attendance-points: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # SMTP is optional; an unreachable/unset mail server must not mark the service DOWN.
    mail:
      enabled: false

logging:
  level:
    com.communitycleanup: INFO
